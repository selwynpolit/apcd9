# Homepage: hero with shuffle placard, upcoming-events strip, featured
# spotlight, and the blended signs/memes wall. The wall's Views display is
# deliberately named wall_recent_all, not block_recent_all -- the "block_"
# prefix is what apc_brown_preprocess_views_view() matches to opt a display
# into the shuffle-and-cycle carousel treatment (one photo at a time), which
# is wrong here: this is meant to read as a grid of several photos at once,
# same as the /photos browse page. Confirmed live: with the "block_" name it
# silently collapsed to a single-photo carousel.
front-page:
  version: VERSION
  css:
    theme:
      css/components/front-page.css: {}
  js:
    js/sign-shuffle.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupal.ajax
    - core/drupal.dialog.ajax
    - apc_brown/event-popup
    - apc_brown/lightbox

# /calendar/upcoming: colorful card grid + signs/blog sidebar. Depends on
# apc_brown/front-page for the shared card markup rules (.apc-front__card-title,
# .apc-front__card-overlay, .apc-default-event-image, popup dialog AJAX) --
# EventCardBuilder renders this page's cards with the exact same markup as
# the homepage's, just laid out differently.
upcoming-events:
  version: VERSION
  css:
    theme:
      css/components/upcoming-events.css: {}
  dependencies:
    - apc_brown/front-page

# Click-to-swap hero + thumbnail rail. Shared by the event/location detail
# pages (via detail-page's dependency) and the calendar event popup dialog
# (attached directly from field--field-event-image--calendar-item.html.twig).
gallery:
  version: VERSION
  css:
    theme:
      css/components/gallery.css: {}
  js:
    js/gallery.js: {}
  dependencies:
    - core/drupal
    - core/once

