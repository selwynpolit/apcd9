    theme:
      css/components/lightbox.css: {}
  js:
    js/lightbox.js: {}
  dependencies:
    - core/drupal
    - core/once

# Wires the signs/memes wall's photos into apc_brown/lightbox instead of the
# richer apc_brown/photo-lightbox the carousels and the /photos grid use --
# see js/wall-lightbox.js for why.
wall-lightbox:
