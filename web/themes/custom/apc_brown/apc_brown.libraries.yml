# Full-size zoomable lightbox with caption/credit, for photo_gallery carousel
# blocks only (not the generic apc_brown/lightbox used on event/location
# photos, and not the /photos browse grid, which still just links to the
# node). Attached by apc_brown_preprocess_block() on exactly the block
# placements marked [data-apc-photo-lightbox]; see photo-carousel.js.
photo-lightbox:
  version: VERSION
  css:
    theme:
      css/components/photo-lightbox.css: {}
  js:
    js/photo-lightbox.js: {}
  dependencies:
    - core/drupal
    - core/once

# Stops core Views' post-AJAX "scroll to top of view" command from firing on
# the /photos browse grid's exposed filters (Category, Photo/Sign) --
# without it, checking a box while scrolled elsewhere on the page snapped
# the viewport back to the results grid, which read as a full reload even
# though the request was genuinely AJAX. See js/disable-views-scroll-top.js.
# Attached only on page_1 (the one ajax-enabled display with an exposed
# form) by apc_brown_preprocess_views_view().
disable-views-scroll-top:
  version: VERSION
  js:
    js/disable-views-scroll-top.js: {}
  dependencies:
    - core/drupal.ajax

# Filters /calendar's events by category without a page reload -- attached
# by apc_brown_preprocess_views_view() on views.view.calendar's page_1
# display only. See calendar-filter.js for why this can't just be Views'
# own AJAX (it would reset FullCalendar to today's month on every filter
# change): drupalSettings is needed to reach the live FullCalendar.Calendar
# instance fullcalendar_view.js keeps at drupalSettings.calendar[].
calendar-filter:
  version: VERSION
  css:
    theme:
      css/components/calendar-filter.css: {}
  js:
    js/calendar-filter.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
