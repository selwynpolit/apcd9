    theme:
      css/components/event-popup.css: {}

# Media Library grid for the front theme (anonymous submitters). Attached by
# libraries-extend on media_library/view + media_library/widget.
media-library:
  version: VERSION
  css:
    component:
      css/components/media-library.css: {}

# Works around a media_library.ui.js bug (drupal.org #3463417, unreleased)
# that can double the "N of 1 item selected" line in the Add-media dialog's
# button pane -- confirmed live on the anonymous upload flow. Attached by
# libraries-extend on media_library/ui specifically (not view/widget above),
# so it loads -- and its listener registers -- after that core script. See
# js/media-library-selection-count-fix.js.
media-library-selection-count-fix:
  version: VERSION
  js:
    js/media-library-selection-count-fix.js: {}
  dependencies:
    - core/drupal

