<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="apcDefaultEventImageTitle">
<title id="apcDefaultEventImageTitle">Austin Progressive Calendar</title>
<defs>
  <linearGradient id="apcDefaultSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f5ead8"/>
    <stop offset="100%" stop-color="#ebddc5"/>
  </linearGradient>
  <clipPath id="apcDefaultLogoClip">
    <circle cx="600" cy="404" r="118"/>
  </clipPath>
</defs>

<rect width="1200" height="675" fill="url(#apcDefaultSky)"/>
<circle cx="960" cy="150" r="90" fill="#fdca40" opacity="0.35"/>

<g fill="none" stroke="#c9b09a" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.6">
  <line x1="0" y1="90" x2="1200" y2="90"/>
  <line x1="0" y1="180" x2="1200" y2="180"/>
  <line x1="0" y1="270" x2="1200" y2="270"/>
</g>

<g fill="#8a5a34">
  <rect x="40" y="430" width="90" height="170"/>
  <rect x="140" y="380" width="70" height="220"/>
  <rect x="220" y="450" width="60" height="150"/>
  <rect x="990" y="410" width="80" height="190"/>
  <rect x="1080" y="460" width="70" height="140"/>
  <rect x="900" y="470" width="70" height="130"/>
</g>

<g fill="#634329">
  <rect x="330" y="470" width="50" height="130"/>
  <rect x="830" y="480" width="50" height="120"/>
  <rect x="260" y="500" width="45" height="100"/>
  <rect x="905" y="500" width="45" height="100"/>
</g>

<!-- UT Tower -->
<g fill="#503724">
  <rect x="240" y="300" width="34" height="300"/>
  <rect x="232" y="284" width="50" height="18"/>
  <polygon points="257,240 234,284 280,284"/>
  <rect x="250" y="330" width="18" height="26" fill="#f5ead8" opacity="0.85"/>
  <rect x="250" y="380" width="18" height="26" fill="#f5ead8" opacity="0.85"/>
</g>

<!-- Texas State Capitol -->
<g fill="#503724">
  <rect x="880" y="440" width="220" height="160"/>
  <rect x="860" y="420" width="260" height="24"/>
  <g>
    <rect x="900" y="380" width="16" height="60"/>
    <rect x="940" y="380" width="16" height="60"/>
    <rect x="980" y="380" width="16" height="60"/>
    <rect x="1020" y="380" width="16" height="60"/>
    <rect x="1060" y="380" width="16" height="60"/>
  </g>
  <rect x="895" y="340" width="210" height="42"/>
  <ellipse cx="1000" cy="340" rx="70" ry="34"/>
  <rect x="960" y="270" width="80" height="76"/>
  <ellipse cx="1000" cy="270" rx="40" ry="22"/>
  <rect x="990" y="220" width="20" height="56"/>
  <polygon points="1000,196 990,222 1010,222"/>
</g>

<g fill="#8a5a34" opacity="0.9">
  <rect x="380" y="500" width="500" height="100"/>
  <rect x="410" y="460" width="50" height="140"/>
  <rect x="700" y="450" width="55" height="150"/>
  <rect x="600" y="480" width="45" height="120"/>
</g>

<!-- Whimsical accents, matching the invite-card flyer style used elsewhere on the site -->
<g fill="#3fa21c">
  <path d="M150 120 l6 14 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2 z"/>
  <path d="M780 200 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2 z"/>
</g>
<g fill="#e33f1e">
  <circle cx="90" cy="250" r="7"/>
  <circle cx="1120" cy="230" r="7"/>
</g>

<circle cx="600" cy="404" r="126" fill="#f5ead8"/>
<circle cx="600" cy="404" r="122" fill="none" stroke="#8a5a34" stroke-width="3"/>
<g clip-path="url(#apcDefaultLogoClip)">
  <image href="data:image/jpeg;base64," x="482" y="286" width="236" height="236" preserveAspectRatio="xMidYMid slice"/>
</g>
</svg>
