services:
  apc_calendar.tag_suggester:
    class: Drupal\apc_calendar\TagSuggester
    arguments: ['@entity_type.manager']

  apc_calendar.photo_batch_importer:
    class: Drupal\apc_calendar\PhotoBatchImporter
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@image.factory'
      - '@focal_point.manager'
      - '@file.mime_type.guesser'
      - '@token'
      - '@logger.channel.apc_calendar'

  apc_calendar.photo_batch_prep:
    class: Drupal\apc_calendar\PhotoBatchPrep
    arguments:
      - '@entity_type.manager'

  logger.channel.apc_calendar:
    parent: logger.channel_base
    arguments: ['apc_calendar']

  apc_calendar.base_url_consistency:
    class: Drupal\apc_calendar\EventSubscriber\BaseUrlConsistencySubscriber
    arguments: ['@router.request_context']
    tags:
      - { name: event_subscriber }
