calendar_manage:
  version: 1.x
  css:
    theme:
      css/calendar-manage.css: {}

calendar_toggle:
  version: 1.x
  css:
    theme:
      css/calendar-toggle.css: {}

more_popover_dialog:
  version: 1.x
  js:
    js/more-popover-dialog.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupal
    - core/drupal.ajax
    - core/drupal.dialog.ajax

event_hover:
  version: 1.x
  js:
    js/event-hover.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupal
    - core/drupalSettings
    # Doesn't guarantee drupalSettings.calendar[] exists yet by attach time --
    # fullcalendar_view.js builds it via a document.readyState poll, not
    # Drupal.behaviors, so this library's own JS polls for it too (see the
    # comment in event-hover.js). This dependency is just what makes
    # FullCalendar's globals and calendar_options settings available at all.
    - fullcalendar_view/fullcalendar

add_location_autocomplete:
  version: 1.x
  js:
    js/add-location-autocomplete.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupal
    - core/drupal.autocomplete
    - core/drupal.dialog.ajax

# Disables scroll-wheel zoom on the geofield's Leaflet widget map (location
# term form), so scrolling the page isn't trapped by the map. Attached by
# apc_calendar_form_taxonomy_term_locations_form_alter(). Uses jQuery because
# the leaflet module signals map init via a jQuery 'leaflet.map' event.
leaflet_no_scroll_zoom:
  version: 1.x
  js:
    js/leaflet-no-scroll-zoom.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupal
    - core/drupalSettings

# Scrolls the "Add or select media" dialog to its own top when it opens --
# confirmed live that it otherwise lands ~225px pre-scrolled, hiding the
# Dropzone drop target above the fold, for anonymous and authenticated users
# alike. Attached by both submission forms' shared form-alter
# implementations. No jQuery needed: 'dialog:aftercreate' is a plain window
# CustomEvent core dispatches itself.
media_dialog_scroll_top:
  version: 1.x
  js:
    js/media-dialog-scroll-top.js: {}
  dependencies:
    - core/drupal.dialog

# Layout fix for the focal-point explanation text added to the Media
# Library "Add media" dialog by _apc_calendar_add_focal_point_explanation().
# Attached by apc_calendar_form_media_library_add_form_dropzonejs_alter().
focal_point_help:
  version: 1.x
  css:
    theme:
      css/focal-point-help.css: {}
