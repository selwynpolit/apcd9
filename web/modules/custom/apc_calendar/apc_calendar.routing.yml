apc_calendar.event_submitted:
  path: '/event-submitted'
  defaults:
    _title: 'Event Submitted'
    _controller: '\Drupal\apc_calendar\Controller\EventSubmittedController'
  requirements:
    _permission: 'access content'
  options:
    # The response renders the visitor's own unpublished node, so it is
    # per-session and must never be stored in the anonymous page cache.
    no_cache: TRUE

apc_calendar.photo_submitted:
  path: '/photo-submitted'
  defaults:
    _title: 'Photo Submitted'
    _controller: '\Drupal\apc_calendar\Controller\PhotoSubmittedController'
  requirements:
    _permission: 'access content'
  options:
    # Renders the visitor's own just-submitted unpublished node, so it is
    # per-session and must never enter the anonymous page cache.
    no_cache: TRUE

apc_calendar.publish_photo:
  path: '/admin/content/photos/{node}/publish'
  defaults:
    _controller: '\Drupal\apc_calendar\Controller\PublishPhotoController::publish'
  requirements:
    # Plain node update access -- the same gate the entity operation checks --
    # not administer nodes. CSRF-protected because it changes state over GET.
    _entity_access: 'node.update'
    node: \d+
    _csrf_token: 'TRUE'
  options:
    parameters:
      node:
        type: 'entity:node'

apc_calendar.event_popup:
  path: '/calendar/event/{node}/{delta}'
  defaults:
    _title: 'Event'
    _controller: '\Drupal\apc_calendar\Controller\EventPopupController::popup'
  requirements:
    # Node access is what stops this route becoming a way to read unpublished
    # pending submissions. Do not relax it.
    _entity_access: 'node.view'
    node: \d+
    delta: \d+
  options:
    parameters:
      node:
        type: 'entity:node'

apc_calendar.event_ics:
  path: '/calendar/event/{node}/{delta}/ics'
  defaults:
    _controller: '\Drupal\apc_calendar\Controller\EventIcsController::ics'
  requirements:
    # Same node-access gate as the popup route -- this must not become a way to
    # download a pending/unpublished event.
    _entity_access: 'node.view'
    node: \d+
    delta: \d+
  options:
    parameters:
      node:
        type: 'entity:node'

apc_calendar.publish_event_and_location:
  path: '/calendar/event/{node}/publish'
  defaults:
    _controller: '\Drupal\apc_calendar\Controller\PublishEventAndLocationController::publish'
  requirements:
    # Same access PublishEventAndLocation::access() already checks for the VBO
    # action -- plain entity update access, not administer nodes.
    _entity_access: 'node.update'
    node: \d+
    _csrf_token: 'TRUE'
  options:
    parameters:
      node:
        type: 'entity:node'

apc_calendar.unpublish_event:
  path: '/calendar/event/{node}/unpublish'
  defaults:
    _controller: '\Drupal\apc_calendar\Controller\PublishEventAndLocationController::unpublishEvent'
  requirements:
    _entity_access: 'node.update'
    node: \d+
    _csrf_token: 'TRUE'
  options:
    parameters:
      node:
        type: 'entity:node'

apc_calendar.unpublish_event_and_location:
  path: '/calendar/event/{node}/unpublish-all'
  defaults:
    _controller: '\Drupal\apc_calendar\Controller\PublishEventAndLocationController::unpublishEventAndLocation'
  requirements:
    _entity_access: 'node.update'
    node: \d+
    _csrf_token: 'TRUE'
  options:
    parameters:
      node:
        type: 'entity:node'

apc_calendar.add_location:
  path: '/calendar/location/add'
  defaults:
    _title: 'Add a location'
    _form: '\Drupal\apc_calendar\Form\AddLocationForm'
  requirements:
    # The same permission core checks for creating a term in this vocabulary.
    # Anonymous already holds it; see the plan, §3d.
    _permission: 'create terms in locations'
  options:
    no_cache: TRUE
