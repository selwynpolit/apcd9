id: tagged_content
label: 'Tagged content'
module: views
description: "Content referencing a given tags-vocabulary term, across any content type -- embedded on the tags taxonomy term page (apc_brown_preprocess_taxonomy_term()) so clicking a tag pill on the photo gallery or an event actually shows what is tagged with it. Deliberately built as a standalone block-only view (no page display, no route) rather than re-enabling the core taxonomy_term view: that view's own page route at taxonomy/term/%25 is exactly what previously hijacked the locations vocabulary's term page (see Event Calendar Plan.md) -- this view can never repeat that because it registers no route at all. Uses the shared taxonomy_index table (populated automatically for any entity_reference-to-taxonomy_term field, regardless of field name), so one contextual filter here covers field_tags (calendar_event) and field_photo_tags (community_photo) alike -- confirmed live that taxonomy_index has rows for both."
